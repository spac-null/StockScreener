# Autonomous features
autonomous:
  enabled: true
  mode: "hybrid"              # NEW: hybrid mode

  # Urgent alert logic
  urgent_detection:
    enabled: true
    check_every_scan: true
    duplicate_window_hours: 24   # Don't alert same ticker twice in 24h

  # Auto-discovery
  discover_new_tickers: true
  discovery_interval_days: 7
  max_tickers: 100

  # Auto-tuning
  auto_tune_thresholds: true
  tune_interval_days: 7
  target_alerts_per_day: 3

  # Auto-pruning
  prune_dead_tickers: true
  prune_after_days: 30

  # Performance tracking
  track_performance: true
  performance_file: "performance_history_hybrid.json"

  # Health monitoring
  auto_restart: true
  health_check_interval: 3600
  max_consecutive_errors: 5

logging:
  enabled: true
  log_file: "autonomous_hybrid.log"
  log_level: "INFO"

risk_management:
