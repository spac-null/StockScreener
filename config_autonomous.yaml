# Autonomous features
autonomous:
  enabled: true

  # Auto-discovery
  discover_new_tickers: true
  discovery_interval_days: 7      # Weekly discovery
  max_tickers: 100                # Cap total tickers

  # Auto-tuning
  auto_tune_thresholds: true
  tune_interval_days: 7           # Weekly tuning
  target_alerts_per_day: 3        # Optimize for this rate

  # Auto-pruning
  prune_dead_tickers: true
  prune_after_days: 30            # Remove if no alerts in 30 days
  keep_recent_discoveries: true   # Don't prune newly discovered

  # Performance tracking
  track_performance: true
  performance_file: "performance_history.json"

  # Health monitoring
  auto_restart: true
  health_check_interval: 3600     # 1 hour
  max_consecutive_errors: 5       # Restart if 5 errors in a row

logging:
  enabled: true
  log_file: "autonomous_screener.log"
  log_level: "INFO"
  max_log_size_mb: 100
  backup_count: 5

risk_management:
  stop_loss_percentage: 10
  disclaimer: "⚠️ NOT FINANCIAL ADVICE. High-risk stocks. Possible total loss. Always do your own research."

# Reporting
reporting:
  weekly_summary: true
  monthly_report: true
  include_performance_metrics: true
  include_config_changes: true
  include_discovered_tickers: true
