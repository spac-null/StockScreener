# Autonomous Stock Screener Configuration
# "Set and Forget" Mode - Self-manages for weeks/months

api:
  polygon_api_key: "Y2Qew5cni67EIpHHQshd7Pj6Rl1DFZd6"

email:
  enabled: true
  smtp_server: "send.one.com"
  smtp_port: 587
  sender_email: "crypto@jaschablume.nl"
  sender_password: "CrYpt0W1zz"
  receiver_email: "musabanana@protonmail.com"

  # Weekly summary instead of constant alerts
  summary_mode: true
  summary_day: "Sunday"  # Day of week for summary
  summary_hour: 20      # Hour (24h format)

screening:
  # Initial thresholds (will auto-adjust)
  min_price: 0.5
  max_price: 3.0
  min_daily_change: 2.0    # Start moderate, will tune
  min_volume: 400000       # Start moderate, will tune

  scan_interval: 14400     # 4 hours
  max_notifications: 10    # Higher for weekly summary

  news_lookback_hours: 48

  # Target sectors
  target_sectors:
    - quantum
    - quantum computing
    - AI
    - artificial intelligence
    - gene therapy
    - gene editing
    - CRISPR
    - fusion
    - fusion energy
    - space
    - satellite
    - solid-state battery
    - battery technology
    - renewable
    - semiconductor

# Starting ticker list (will auto-expand)
etoro_available:
  # Quantum
  - IONQ
  - QUBT

  # AI
  - PLTR
  - AI
